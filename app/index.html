<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
      <p class="status" role="status" aria-live="polite"></p>
    </header>
    <main data-testid="board">
      <p data-testid="loader" class="loader">Loading incidents…</p>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <ul data-testid="incident-list" class="list"></ul>
    </main>
    <footer>sched-prod incident board · build <span data-testid="build-sha" class="sha">__BUILD_SHA__</span></footer>
    <section data-testid="confirm" class="confirm" role="dialog" aria-label="Confirm the ack" hidden>
      <p class="confirm-text"><strong class="confirm-id"></strong> <span class="confirm-what"></span> <span class="confirm-error" role="alert"></span></p>
      <button type="button" class="confirm-ack" data-testid="confirm-ack">Ack</button>
      <button type="button" class="confirm-cancel" data-testid="confirm-cancel">Cancel</button>
    </section>
  </body>
</html>
